<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Switch Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width:500px;">
        <h2 class="text-center mb-4">Switch Calculator</h2>

        <div class="mb-3">
            <label>First Number</label>
            <input type="number" id="num1" class="form-control">
        </div>

        <div class="mb-3">
            <label>Second Number</label>
            <input type="number" id="num2" class="form-control">
        </div>

        <div class="mb-3">
            <label>Select Operation</label>
            <select id="operation" class="form-select">
                <option value="add">Addition</option>
                <option value="sub">Subtraction</option>
                <option value="mul">Multiplication</option>
                <option value="div">Division</option>
            </select>
        </div>

        <button class="btn btn-primary w-100" onclick="calculate()">
            Calculate
        </button>

        <h3 class="text-center mt-4" id="result"></h3>
    </div>
</div>

<script>
function calculate() {

    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let operation = document.getElementById("operation").value;

    let result;

    switch (operation) {

        case "add":
            result = num1 + num2;
            break;

        case "sub":
            result = num1 - num2;
            break;

        case "mul":
            result = num1 * num2;
            break;

        case "div":
            if (num2 === 0) {
                result = "Cannot divide by zero!";
            } else {
                result = num1 / num2;
            }
            break;

        default:
            result = "Invalid Operation";
    }

    document.getElementById("result").innerHTML = "Result: " + result;
}
</script>

</body>
</html>
